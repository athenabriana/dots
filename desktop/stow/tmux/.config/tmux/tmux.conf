# tmux config — tmux as a pure session-keeper behind ghostty.
# Prefix: Ctrl+A. Ghostty owns tabs/splits at the terminal layer; tmux
# only persists sessions (resurrect + continuum, cloned into
# ~/.tmux/plugins by `dots sync`).

source-file ~/.config/tmux/tmux.reset.conf

# --- terminal / behavior ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,ghostty:RGB,xterm-ghostty:RGB"
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy on
set -g escape-time 0
set -g history-limit 1000000
set -g set-clipboard on
set -g mouse on
set -g focus-events on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "tmux · #S · #W"

# --- panes ---
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# --- status bar ---
# Off. Ghostty's tab bar carries window/session context now; the tmux
# status bar would just duplicate it and steal a row.
set -g status off

# --- copy mode (vi-style, wayland clipboard) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# --- sesh picker (prefix+o) ---
# Delegates to the `t` shell function so the popup picks up the same
# enter / ctrl-n / ctrl-d keymap. Runs the user's shell interactively
# so the function (defined in shell/40-aliases.sh) is sourced.
bind o display-popup -E -w 80% -h 70% '${SHELL:-zsh} -ic t'

# --- session persistence (resurrect + continuum) ---
# Plugins cloned into ~/.tmux/plugins by `dots sync`. Continuum
# auto-saves every 15min and auto-restores on tmux server start;
# capture-pane contents included so scrollback survives reboots.
# No @continuum-boot — tmux stays launch-on-demand (`t` / `sesh connect`).
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
if-shell '[ -x ~/.tmux/plugins/resurrect/resurrect.tmux ]' \
    'run-shell ~/.tmux/plugins/resurrect/resurrect.tmux'
if-shell '[ -x ~/.tmux/plugins/continuum/continuum.tmux ]' \
    'run-shell ~/.tmux/plugins/continuum/continuum.tmux'
