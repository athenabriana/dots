# tmux.reset.conf — keybind overrides applied before tmux.conf finishes.

# splits open in CWD of the current pane
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# repeatable resize
bind -r , resize-pane -L 20
bind -r . resize-pane -R 20
bind -r - resize-pane -D 7
bind -r = resize-pane -U 7

# session / window helpers
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind S choose-session
bind r command-prompt "rename-window %%"
bind z resize-pane -Z
bind K send-keys "clear" \; send-keys "Enter"
