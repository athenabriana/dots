# Toolchains and runtimes — things projects pin via .tool-versions /
# idiomatic version files. Latest-only CLI apps live in common/Brewfile;
# the split: mise = versioned per project, brew = system-wide latest.
[tools]
node = "lts"
bun = "latest"
pnpm = "latest"
python = "latest"
uv = "latest"
go = "latest"
rust = "stable"
java = "21"
maven = "latest"
terraform = "latest"

# No brew formula on Linux — stay in mise regardless of tier.
gcloud = "latest"
claude = "latest"
"npm:skills" = "latest"
"npm:agent-browser" = "latest"

[settings]
trusted_config_paths = [ "/" ]
auto_install = true
not_found_auto_install = true
idiomatic_version_file_enable_tools = [
  "node",
  "bun",
  "pnpm",
  "python",
  "go",
  "rust",
  "terraform",
]

[settings.status]
missing_tools = "always"
