# gpg-agent — no passphrase caching for gpg (prompt on every use).
# No pinentry-program pin: gnupg's build-time default resolves to the
# right pinentry per platform (brew's curses one here, works headless).
default-cache-ttl 0
max-cache-ttl 0

# Serve SSH as well — gpg-agent replaces ssh-agent. Keys enter with
# `ssh-add` (stored encrypted under ~/.gnupg, listed in sshcontrol);
# the shell exports SSH_AUTH_SOCK in 06-gpg.sh.
enable-ssh-support
default-cache-ttl-ssh 28800
max-cache-ttl-ssh 86400
